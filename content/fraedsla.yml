# Fræðsla (courses, coming soon). The story below is a short stand-in:
# Emilia writes her own (why she wants to teach) before launch.
title:
  is: Fræðsla
  en: Learning
coming_soon:
  is: Námskeið í dáleiðslu eru í undirbúningi
  en: Hypnotherapy courses are on their way
# Draft from Marina's words (4 Nov), in Emilia's voice; Emilia approves. "healing" softened to "journey / supporting others".
body:
  is: |
    Mig langar að kenna dáleiðslu. Ef þú vilt læra þessa aðferð hlakka ég til að deila henni með þér.

    Þetta er það sem ég brenn fyrir að miðla, því það sprettur beint úr margra ára reynslu minni af vinnu með fólki, og af minni eigin vegferð og því að styðja aðra á sinni.

    Skráðu þig á biðlistann og þú verður meðal þeirra fyrstu til að frétta þegar námskeiðin fara af stað.
  en: |
    I would love to teach hypnotherapy. If you'd like to learn this technique, I'm thrilled to share it with you.

    It's what I'm most passionate about passing on, because it comes straight from my years of working with people, and from my own journey and supporting others on theirs.

    Join the waiting list and you'll be among the first to hear when the courses begin.
