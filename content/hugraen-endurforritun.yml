# Hugræn endurforritun. Texts: Emilia (3 Nov 2026). Price + length: her Framer draft.
title:
  is: Hugræn endurforritun
  en: Cognitive reprogramming
lead:
  is: Sérhæfð dáleiðslumeðferð sem vinnur með undirvitundina og þau mynstur sem hafa mótast í gegnum lífið.
  en: A specialised hypnotherapy that works with the subconscious and the patterns formed over a lifetime.
price:
  duration:
    is: um 2½–3 klst.
    en: about 2½–3 hours
  amount: 47.000 kr.
sections:
  - heading:
      is: Hvað er Hugræn endurforritun?
      en: What is cognitive reprogramming?
    body:
      is: |
        Hugræn endurforritun er sérhæfð dáleiðslumeðferð sem vinnur með undirvitundina og þau mynstur sem hafa mótast í gegnum lífið. Þar geta legið viðhorf, tilfinningaleg viðbrögð og reynsla sem hafa áhrif á hvernig við hugsum, bregðumst við og upplifum okkur sjálf og aðra.

        Meðferðin sameinar þætti úr Ego State Therapy (vinnu með ólíka hluta sjálfsins), Subliminal Therapy og Trauma Therapy (áfallameðferð) ásamt þekkingu úr taugafræði og rannsóknum á starfsemi hugans.

        Í meðferðinni er meðal annars unnið með viðhorf og skilaboð sem hafa mótast í gegnum uppeldi og lífsreynslu, óunnar tilfinningar sem geta haft áhrif á líðan í dag og þá hluta sjálfsins sem þróast hafa til að takast á við ólíkar aðstæður í lífinu. Markmiðið er að vinna með undirliggjandi orsakir fremur en eingöngu einkenni og skapa þannig forsendur fyrir varanlegri breytingu, aukinni vellíðan og meiri innri sátt.
      en: |
        Hugræn endurforritun (cognitive reprogramming) is a specialised hypnotherapy that works with the subconscious and the patterns that have formed over a lifetime. These can include beliefs, emotional reactions and experiences that affect how we think, react and see ourselves and others.

        The treatment combines elements of Ego State Therapy (working with different parts of the self), Subliminal Therapy and trauma therapy, together with knowledge from neuroscience and research on how the mind works.

        Among other things, we work with beliefs and messages formed through upbringing and life experience, unprocessed feelings that may affect your wellbeing today, and the parts of the self that developed to cope with different situations in life. The aim is to work with underlying causes rather than symptoms alone, and so create the conditions for lasting change, greater wellbeing and more inner peace.
  - heading:
      is: Hugræn endurforritun getur meðal annars nýst við
      en: Cognitive reprogramming can help with, among other things
    body:
      is: |
        - Kvíða og streitu
        - Áföll og erfiða lífsreynslu
        - Sjálfsefa og lágt sjálfsmat
        - Samskipta- og tengslavanda
        - Erfiðleika við að setja mörk
        - Endurtekin mynstur í lífinu
        - Innri pressu og fullkomnunaráráttu
        - Óöryggi og skort á sjálfstrausti
        - Kynlífs- og nándarvanda
        - Lífsbreytingar og krefjandi tímabil
      en: |
        - Anxiety and stress
        - Trauma and difficult life experiences
        - Self-doubt and low self-esteem
        - Difficulties in communication and relationships
        - Difficulty setting boundaries
        - Repeating patterns in life
        - Inner pressure and perfectionism
        - Insecurity and lack of self-confidence
        - Sexual and intimacy difficulties
        - Life changes and demanding periods
  - heading:
      is: Sérstök áhersla
      en: A particular focus
    body:
      is: |
        Þegar dýpra er skoðað snýst margt af því sem hefur áhrif á líðan okkar um sjálfsmyndina, tengslin sem við eigum við okkur sjálf og samskipti okkar við aðra. Þar liggja oft ræturnar að þeim breytingum sem við leitum eftir.

        Stundum vitum við að breytinga er þörf, en vitum ekki alveg hvar við eigum að byrja. Líkt og fræ sem þarf réttar aðstæður til að vaxa býr hver einstaklingur yfir eigin styrkleikum og möguleikum. Markmið mitt er að skapa öruggt rými þar sem hægt er að vinna með það sem heldur aftur af okkur og styðja við þá breytingu sem þegar býr innra með okkur.
      en: |
        When we look deeper, much of what affects our wellbeing comes down to self-image, the relationship we have with ourselves and how we relate to others. That is often where the roots of the changes we are looking for lie.

        Sometimes we know that change is needed but don't quite know where to begin. Like a seed that needs the right conditions to grow, every person carries their own strengths and potential. My aim is to create a safe space where we can work with what holds us back, and support the change that already lives within us.
