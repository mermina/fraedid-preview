name_story:
  heading:
    is: Af hverju Fræið?
    en: Why "Fræið"?
  body:
    is: Fræið varð til út frá þeirri hugmynd að innan hvers einstaklings búi möguleikar til vaxtar og breytinga. Líkt og fræ þarf réttar aðstæður til að spíra þurfum við stundum að staldra við, skoða það sem liggur undir yfirborðinu, vinna úr því sem heldur aftur af okkur og skapa nýjar leiðir fram á við.
    en: Fræið means "the seed". It grew from the idea that within every person lies the potential for growth and change. Just as a seed needs the right conditions to sprout, we sometimes need to pause, look at what lies beneath the surface, work through what holds us back and create new ways forward.
  mottos:
    - is: Markmiðið er ekki að breyta því hver þú ert, heldur að hjálpa þér að finna leiðina aftur að þér.
      en: The aim is not to change who you are, but to help you find your way back to yourself.
    - is: Innri breytingar skapa ytri áhrif.
      en: Inner change creates outer impact.
